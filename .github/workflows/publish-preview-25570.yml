name: Publish Veyr Beta 25570
on:
  push:
    branches: [release/preview-25570]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish and verify the tested ARM64 APK
        run: |
          gh run download 44466035839 --name veyr-preview-arm64-v8a
          asset=veyr-preview-arm64-v8a.apk
          legacy=lauritz-jc-preview-arm64-v8a.apk
          echo '1e07cd86ac879d7e375240fbae94ae85e993918ef2ffaf7514092fe8e613eafe  veyr-preview-arm64-v8a.apk' | sha256sum --check
          cp "$asset" "$legacy"
          gh release create v1.4.2-preview.25570 "$asset" "$legacy" --target 7bd0d1a3c1698d91fdac4dac828daba7ea2656c0 --prerelease --latest=false --title 'Veyr 1.4.2 Beta 25570' --notes '新增渡鸦状态栏图标、规则集 DNS 分流开关、DNS 服务器选择日志，以及近期日志搜索和关键词高亮。ARM64-v8a。两个 APK 内容相同，旧文件名用于兼容旧版更新。'
          gh release view v1.4.2-preview.25570 --json url,isPrerelease,assets
          for apk in "$asset" "$legacy"; do
            curl -fsSL "https://github.com/$GH_REPO/releases/download/v1.4.2-preview.25570/$apk" -o verified.apk
            echo '1e07cd86ac879d7e375240fbae94ae85e993918ef2ffaf7514092fe8e613eafe  verified.apk' | sha256sum --check
          done
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = v1.4.2-stable.25525
