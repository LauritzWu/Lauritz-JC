name: CI
on:
  push:
    tags-ignore:
      - 'v*'
    branches:
      - '*'
      - 'lauritz/starifly-core-1.14'
  pull_request:
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}-ci
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: libcore/go.mod
          cache-dependency-path: libcore/go.sum
      - name: Install Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;25.0.8775105"
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}-ci
      - name: HevTun Status
        run: |
          git submodule status hev-socks5-tunnel > hev_status
          cat buildScript/compile-hevtun.sh | sha1sum >> hev_status
      - name: HevTun Cache
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs
          key: hevtun-${{ hashFiles('.github/workflows/*', 'hev_status') }}-ci
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}-ci
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "ndk;25.0.8775105"
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == lauritz/starifly-core-1.14 ]]; then
            sed -i 's/^PACKAGE_NAME=.*/PACKAGE_NAME=top.lauritz.jc.parallelpreview/' nb4a.properties
          fi
          ./gradlew app:assembleOssDebug
      - name: Verify parallel-install ARM64 preview
        if: github.event_name == 'push' && github.ref_name == 'lauritz/starifly-core-1.14'
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/oss/debug -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/35.0.1"
          "$tools/aapt" dump badging "${apks[0]}" > apk-badging.txt
          grep -F "package: name='top.lauritz.jc.parallelpreview.debug'" apk-badging.txt
          "$tools/apksigner" verify "${apks[0]}"
          "$tools/zipalign" -c -P 16 4 "${apks[0]}"
          cp "${apks[0]}" lauritz-jc-parallel-preview-arm64.apk
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'push' && github.ref_name == 'lauritz/starifly-core-1.14'
        with:
          name: lauritz-jc-parallel-preview-arm64
          path: lauritz-jc-parallel-preview-arm64.apk
          if-no-files-found: error
