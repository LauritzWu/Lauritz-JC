name: Android update channel regression
on:
  push:
    branches: [lauritz/starifly-core-1.14, ci/integrate-release-automation, feature/update-experience]
    paths:
      - '.github/workflows/android-update-regression.yml'
      - 'app/src/main/java/io/nekohasekai/sagernet/ui/AboutFragment.kt'
      - 'app/src/main/java/io/nekohasekai/sagernet/ui/ReleaseUpdate.kt'
      - 'app/src/main/res/values/strings.xml'
      - 'app/src/main/res/values-zh-rTW/strings.xml'
  pull_request:
    paths:
      - '.github/workflows/android-update-regression.yml'
      - 'app/src/main/java/io/nekohasekai/sagernet/ui/AboutFragment.kt'
      - 'app/src/main/java/io/nekohasekai/sagernet/ui/ReleaseUpdate.kt'
      - 'app/src/main/res/values/strings.xml'
      - 'app/src/main/res/values-zh-rTW/strings.xml'
permissions:
  contents: read
jobs:
  update-channel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test the Kotlin rules used by AboutFragment
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ReleaseUpdateRegression.kt" <<'KOTLIN'
          package io.nekohasekai.sagernet.ui

          private data class Release(
              val tag: String,
              val draft: Boolean,
              val prerelease: Boolean,
              val apks: List<String>
          )

          private fun select(releases: List<Release>, includeBeta: Boolean): ReleaseUpdate.Candidate? =
              releases.fold<Release, ReleaseUpdate.Candidate?>(null) { best, item ->
                  ReleaseUpdate.candidate(item.tag, item.draft, item.prerelease, includeBeta, best?.code ?: 0) {
                      item.apks
                  } ?: best
              }

          fun main() {
              val stableApk = "veyr-preview-arm64-v8a.apk"
              val betaApk = "veyr-1.0.4-beta.1-candidate-arm64-v8a.apk"
              val stable = Release("v1.0.3-stable.25810", false, false, listOf(stableApk))
              val beta = Release("v1.0.4-beta.1.25820", true, true, listOf(betaApk))
              for (includeBeta in listOf(false, true)) {
                  check(select(listOf(beta, stable), includeBeta) == ReleaseUpdate.Candidate(25810, stableApk))
              }

              val published = beta.copy(draft = false)
              check(select(listOf(published, stable), false) == ReleaseUpdate.Candidate(25810, stableApk))
              check(select(listOf(published, stable), true) == ReleaseUpdate.Candidate(25820, betaApk))
              check(select(listOf(stable, published), true) == ReleaseUpdate.Candidate(25820, betaApk))
              check(select(listOf(stable, published.copy(apks = listOf("x86.apk"))), true)?.code == 25810L)
              val legacy = Release("v1.0.2-preview.25685", false, true, listOf("lauritz-jc-preview-arm64-v8a.apk"))
              check(select(listOf(legacy), true)?.code == 25685L)
              check(select(listOf(legacy), false) == null)
              check(ReleaseUpdate.isUpgrade(25820, 25810))
              check(!ReleaseUpdate.isUpgrade(25820, 25820))
              check(!ReleaseUpdate.isUpgrade(25810, 25820))
              val namedStableApk = "veyr-1.0.6-stable-arm64-v8a.apk"
              val namedStable = Release("v1.0.6-stable.25875", false, false, listOf(namedStableApk))
              check(select(listOf(namedStable), false) == ReleaseUpdate.Candidate(25875, namedStableApk))
              check(select(listOf(namedStable.copy(apks = listOf(stableApk, namedStableApk))), false)?.apkName == namedStableApk)
              check(select(listOf(namedStable.copy(apks = listOf("veyr-1.0.7-stable-arm64-v8a.apk"))), false) == null)

              val namedBetaApk = "veyr-1.0.6-beta.1-arm64-v8a.apk"
              val betaCompatibilityApk = "veyr-1.0.6-beta.1-candidate-arm64-v8a.apk"
              val namedBeta = Release("v1.0.6-beta.1.25870", false, true, listOf(namedBetaApk))
              check(select(listOf(namedBeta), true) == ReleaseUpdate.Candidate(25870, namedBetaApk))
              check(select(listOf(namedBeta.copy(apks = listOf(betaCompatibilityApk, namedBetaApk))), true)?.apkName == namedBetaApk)
              check(select(listOf(namedBeta), false) == null)
              val simpleBetaApk = "veyr-1.0.7-beta-arm64-v8a.apk"
              val simpleBeta = Release("v1.0.7-beta.1.25885", false, true, listOf(simpleBetaApk))
              check(select(listOf(simpleBeta), true) == ReleaseUpdate.Candidate(25885, simpleBetaApk))
              check(select(listOf(simpleBeta), false) == null)
              check(select(listOf(simpleBeta.copy(tag = "v1.0.7-beta.2.25890")), true) == null)
              println("Android update channel regression passed")
          }
          KOTLIN
          kotlinc app/src/main/java/io/nekohasekai/sagernet/ui/ReleaseUpdate.kt \
            "$RUNNER_TEMP/ReleaseUpdateRegression.kt" -include-runtime -d "$RUNNER_TEMP/release-update-tests.jar"
          java -jar "$RUNNER_TEMP/release-update-tests.jar"
      - name: Check Traditional Chinese update and diagnostic resources
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          resource_dir = Path("app/src/main/res")
          prefixes = ("github_update_", "diagnostic_", "route_rule_set")
          placeholders = re.compile(r"%(?:\d+\$)?[a-zA-Z]")

          def strings(locale):
              result = {}
              for item in ET.parse(resource_dir / locale / "strings.xml").getroot().findall("string"):
                  name = item.attrib["name"]
                  if not name.startswith(prefixes):
                      continue
                  if name in result:
                      raise SystemExit(f"{locale}: duplicate {name}")
                  result[name] = "".join(item.itertext())
              return result

          default = strings("values")
          traditional = strings("values-zh-rTW")
          failures = []
          for name, value in sorted(default.items()):
              translated = traditional.get(name, "")
              if not translated.strip():
                  failures.append(f"{name}: missing Traditional Chinese translation")
              elif Counter(placeholders.findall(value)) != Counter(placeholders.findall(translated)):
                  failures.append(f"{name}: format placeholders differ")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Verified {len(default)} Traditional Chinese strings")
          PY
